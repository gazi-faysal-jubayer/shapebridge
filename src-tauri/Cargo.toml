[package]
name = "shapebridge"
version = "0.1.0"
description = "Lightweight open-source CAD viewer, converter and parametric designer"
license = "Apache-2.0"
repository = "https://github.com/gazi-faysal-jubayer/shapebridge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# small binaries: the whole point of using Tauri
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
