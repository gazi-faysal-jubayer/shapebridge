# Every push and pull request: typecheck, unit tests and web build, then desktop installers for
# Windows, macOS (Apple Silicon and Intel) and Linux, uploaded as artifacts so anyone can test a PR.
# Pushes to main also refresh the rolling "nightly-builds" pre-release.
# No paths filter on purpose: the web job is a required check, and a skipped workflow never reports.
name: Build all

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

concurrency:
  # cancel_closed_pr_builds.yml joins this group by name; keep the two in sync
  group: build-all-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web · typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Unit, golden and kernel tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Test summary
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            tests=$(grep -o 'tests="[0-9]*"' test-results.xml | head -1 | tr -dc 0-9)
            failures=$(grep -o 'failures="[0-9]*"' test-results.xml | head -1 | tr -dc 0-9)
            echo "### Tests: ${tests:-?} run, ${failures:-?} failed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
      - name: Bundle size
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | gzip KB |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.wasm; do
            echo "| $(basename "$f") | $(( $(gzip -c "$f" | wc -c) / 1024 )) |" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ShapeBridge-web
          path: dist
          retention-days: 14

  desktop:
    name: ${{ matrix.name }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, args: "", artifact: ShapeBridge-Windows-x64 }
          - { name: macOS arm64, os: macos-latest, args: "--target aarch64-apple-darwin", artifact: ShapeBridge-macOS-arm64 }
          - { name: macOS x64, os: macos-latest, args: "--target x86_64-apple-darwin", artifact: ShapeBridge-macOS-x64 }
          - { name: Linux x64, os: ubuntu-22.04, args: "", artifact: ShapeBridge-Linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build installers
        run: npx tauri build --ci ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  nightly:
    name: Publish nightly-builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gazi-faysal-jubayer/shapebridge'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ShapeBridge-*-*
          path: artifacts
          merge-multiple: true
      - name: Replace the nightly release assets
        run: |
          files=$(find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
          notes="Automatic build of main at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)). Unstable: for testing only. Installers are unsigned, see docs/plans/release-distribution.md."
          if gh release view nightly-builds >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly-builds" -f sha="$GITHUB_SHA" -F force=true
            gh release view nightly-builds --json assets --jq '.assets[].name' | while read -r a; do gh release delete-asset nightly-builds "$a" -y; done
            gh release edit nightly-builds --prerelease --notes "$notes"
          else
            gh release create nightly-builds --prerelease --target "$GITHUB_SHA" --title "Nightly builds" --notes "$notes"
          fi
          gh release upload nightly-builds $files --clobber
