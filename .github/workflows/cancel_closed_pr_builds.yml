name: Cancel builds of closed pull requests

on:
  # pull_request_target needs no approval for first-time contributors; it must never check out PR code
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cancel:
    # Same group name as build_all.yml, so joining it cancels the PR's unfinished Build all run
    concurrency:
      group: build-all-pull_request-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: echo "Joined build-all-pull_request-${{ github.event.pull_request.number }} to cancel its run."
